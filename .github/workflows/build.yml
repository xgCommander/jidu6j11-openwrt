name: OpenWrt Snapshot Build for Jio AX6000 (JIDU6J11)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false
  # schedule removed on the xgCommander fork: builds run only by manual dispatch

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  PR_NUMBER: "26498" # upstream PR with the device support; set to "" once merged
  IWINFO_PRS: "51" # open openwrt/iwinfo PRs to patch in (space-separated); set to "" once merged
  TARGET: qualcommbe
  SUBTARGET: ipq95xx
  SKUS: "6111 6411 6611 6711 6811 6911"
  EXPECTED_DEVICES: "6" # prepare.sh fails if .config does not enable exactly this many profiles
  KEEP_RELEASES: "7"
  # INF-3 pins. Empty = float (today's behaviour). Use full SHAs; see scripts/prepare.sh.
  OPENWRT_SHA: ""
  PR_SHA: ""
  IWINFO_PATCH_SHA256: "" # "<pr>=<sha256> ..."
  FEEDS_CONF: "" # path in this repo, e.g. a release's feeds.buildinfo
  # INF-2 signed apk feed: OFF unless the repository variable APK_FEED is "true".
  # Turning it on also needs secret APK_SIGN_KEY, keys/apk-feed.pub.pem and Pages (source: Actions).
  APK_FEED: ${{ vars.APK_FEED == 'true' && 'true' || 'false' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      hash: ${{ steps.check.outputs.hash }}
      feed_id: ${{ steps.check.outputs.feed_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Decide whether a build is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          up=${OPENWRT_SHA:-$(git ls-remote "$OPENWRT_REPO" "refs/heads/$OPENWRT_BRANCH" | cut -f1)}
          pr=""
          if [ -n "$PR_NUMBER" ]; then
            pr=${PR_SHA:-$(git ls-remote "$OPENWRT_REPO" "refs/pull/$PR_NUMBER/head" | cut -f1)}
          fi
          iw=""
          for n in $IWINFO_PRS; do
            iw="$iw $(git ls-remote https://github.com/openwrt/iwinfo "refs/pull/$n/head" | cut -f1)"
          done
          own=$(git ls-tree -r HEAD -- config patches tree files bdf feeds.conf.default.d scripts keys | sha256sum | cut -d' ' -f1)
          feed=""
          if [ "$APK_FEED" = "true" ]; then feed=" apk-feed"; fi # empty when off: hash as before
          hash=$(echo "$up $pr $iw $own$feed" | sha256sum | cut -c1-16)

          last=$(gh release view --json body -q .body 2>/dev/null | grep -oP 'Build-Hash: \K\w+' || true)
          echo "current=$hash last=$last"

          if [ "$hash" != "$last" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          # INF-2: unique per run, so a same-day rebuild never reuses another image's feed URL
          echo "feed_id=snapshot-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null
        df -h /

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
          libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
          unzip zlib1g-dev file wget libelf-dev ccache tree

    - name: Restore caches
      uses: actions/cache/restore@v4
      with:
        path: |
          cache/dl
          cache/ccache
        key: build-cache-${{ github.run_id }}
        restore-keys: build-cache-

    # ---- INF-2 (OFF by default): signed per-build apk feed ------------------------------
    - name: "Feed: config (APK_FEED only)"
      if: env.APK_FEED == 'true'
      env:
        FEED_ID: ${{ needs.check.outputs.feed_id }}
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
        base="https://${owner}.github.io/${repo}/feeds/${FEED_ID}"
        # VERSION_REPO is %U in /etc/apk/repositories.d/distfeeds.list, so every image points
        # at the feed built in the same run. ALL_KMODS builds every target kmod for the feed.
        # VERSIONOPT also activates CONFIG_VERSION_DIST from prepare.sh ("OpenWrt (unofficial)"),
        # whose parentheses break the image file names; keep the name and file names of a
        # feed-off build.
        cat > "$RUNNER_TEMP/feed.config" <<EOF
        CONFIG_IMAGEOPT=y
        CONFIG_VERSIONOPT=y
        CONFIG_VERSION_REPO="$base"
        CONFIG_SIGNED_PACKAGES=y
        CONFIG_ALL_KMODS=y
        CONFIG_VERSION_DIST="OpenWrt"
        # CONFIG_VERSION_FILENAMES is not set
        # CONFIG_VERSION_CODE_FILENAMES is not set
        EOF
        cat "$RUNNER_TEMP/feed.config"
        echo "CONFIG_APPEND=$RUNNER_TEMP/feed.config" >> "$GITHUB_ENV"

    - name: Prepare tree
      run: bash scripts/prepare.sh

    - name: "Feed: install signing key (APK_FEED only)"
      if: env.APK_FEED == 'true'
      env:
        APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
      run: |
        if [ -z "$APK_SIGN_KEY" ]; then
          echo "::error::APK_FEED is on but secret APK_SIGN_KEY is not set"; exit 1
        fi
        if [ ! -f keys/apk-feed.pub.pem ]; then
          echo "::error::APK_FEED is on but keys/apk-feed.pub.pem is not committed"; exit 1
        fi
        # OpenWrt signs packages.adb (and each .apk) with $(TOPDIR)/private-key.pem, an ECDSA
        # prime256v1 key; base-files installs the matching public-key.pem into /etc/apk/keys/.
        # Without this file make generates a throwaway key for every build.
        ( umask 077; printf '%s\n' "$APK_SIGN_KEY" > openwrt/private-key.pem )
        openssl ec -in openwrt/private-key.pem -pubout -out openwrt/public-key.pem 2>/dev/null
        if ! cmp -s openwrt/public-key.pem keys/apk-feed.pub.pem; then
          echo "::error::APK_SIGN_KEY does not match keys/apk-feed.pub.pem"; exit 1
        fi

    - name: Download sources
      working-directory: openwrt
      run: make download -j8

    - name: Build
      working-directory: openwrt
      run: make -j"$(($(nproc) + 1))" || make -j1 V=s

    - name: "Feed: remove signing key (APK_FEED only)"
      if: always() && env.APK_FEED == 'true'
      run: rm -f openwrt/private-key.pem

    - name: Validate images (INF-4)
      run: |
        # Fails the build, and so the release, if any SKU's sysupgrade image is missing or is not
        # the image for that SKU (board, DTB model/compatible, calibration variant, FEAT-14 q6_region).
        set -o pipefail
        d=openwrt/bin/targets/$TARGET/$SUBTARGET
        mkdir -p validate
        : > validate/validate-image.txt
        fail=0
        for sku in $SKUS; do
          img=$(find "$d" -maxdepth 1 -name "*-jidu${sku}-squashfs-sysupgrade.bin" | head -n1)
          echo "== jidu$sku: ${img:-MISSING}" | tee -a validate/validate-image.txt
          if [ -z "$img" ]; then fail=1; continue; fi
          python3 -I scripts/validate-image.py "$img" "$sku" 2>&1 | tee -a validate/validate-image.txt \
            || fail=1
          python3 -I scripts/validate-image.py "$img" "$sku" --json \
            > "validate/validate-image-jidu$sku.json" || true
        done
        if [ "$fail" -ne 0 ]; then
          echo "::error::image validation failed; see the log above"
          exit 1
        fi

    - name: Save caches
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          cache/dl
          cache/ccache
        key: build-cache-${{ github.run_id }}

    - name: Build Summary
      if: always()
      run: |
        cd openwrt

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🖥️  Runner Info"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  OS      : $(lsb_release -ds)"
        echo "  CPU     : $(nproc) cores"
        echo "  RAM     : $(free -h | awk '/^Mem/{print $2}') total / $(free -h | awk '/^Mem/{print $7}') available"
        echo "  Disk    : $(df -h . | awk 'NR==2{print $4}') free of $(df -h . | awk 'NR==2{print $2}')"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🎯 Build Target"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Target  : $(grep 'CONFIG_TARGET_BOARD' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Subtarget: $(grep 'CONFIG_TARGET_SUBTARGET' .config | cut -d= -f2 | tr -d '\"')"
        echo "  Devices :"
        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -E 's/.*_DEVICE_(.*)=y/    - \1/'

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📜 Git Commits (last 5)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        git log --oneline -5

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Build Artifacts"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        ls -1 bin/targets/$TARGET/$SUBTARGET/ 2>/dev/null || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📏 Image Sizes"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        ls -lh bin/targets/$TARGET/$SUBTARGET/*sysupgrade* bin/targets/$TARGET/$SUBTARGET/*initramfs* 2>/dev/null | awk '{print "  " $5 "  " $9}' || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📦 Selected Packages Count"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  Total   : $(grep '^CONFIG_PACKAGE_.*=y' .config | wc -l) packages"

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  📊 ccache Stats"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        staging_dir/host/bin/ccache -vv --show-stats || true

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "  🌐 Feeds"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        cat feeds.conf

        echo ""

    - name: Collect artifacts
      run: |
        d=openwrt/bin/targets/$TARGET/$SUBTARGET
        mkdir out
        find "$d" -maxdepth 1 -type f \
          \( -name '*sysupgrade*' -o -name '*initramfs*' \) \
          -exec cp {} out/ \;
        # INF-5: the build record next to the images
        cp "$d"/*.manifest "$d"/config.buildinfo "$d"/feeds.buildinfo "$d"/version.buildinfo out/
        cp inputs.json validate/validate-image.txt out/
        tar -C validate -czf out/validate-image-json.tar.gz $(cd validate && ls validate-image-jidu*.json)
        ls -lh out

    - name: "Feed: stage (APK_FEED only)"
      if: env.APK_FEED == 'true'
      env:
        FEED_ID: ${{ needs.check.outputs.feed_id }}
      run: |
        # Same layout as downloads.openwrt.org, so distfeeds.list (%U/targets/%S/packages,
        # %U/packages/%A/<feed>) resolves under feeds/<FEED_ID>/ on Pages.
        f="feed/$FEED_ID"
        mkdir -p "$f/targets/$TARGET/$SUBTARGET"
        cp -a "openwrt/bin/targets/$TARGET/$SUBTARGET/packages" "$f/targets/$TARGET/$SUBTARGET/"
        cp -a openwrt/bin/packages "$f/"
        find "$f" -name packages.adb | sort
        test -f "$f/targets/$TARGET/$SUBTARGET/packages/packages.adb"
        cp keys/apk-feed.pub.pem out/apk-feed.pub.pem
        tar -C feed -czf "out/feed-$FEED_ID.tar.gz" "$FEED_ID"
        du -sh feed "out/feed-$FEED_ID.tar.gz"

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        HASH: ${{ needs.check.outputs.hash }}
      run: |
        bash scripts/gen-release-notes.sh out > release-notes.md
        (cd out && sha256sum * > sha256sums)

        tag="snapshot-$(date -u +%Y%m%d)"
        gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$tag" out/* \
          --title "Snapshot $(date -u +%Y-%m-%d)" \
          --notes-file release-notes.md

        gh release list --limit 100 --json tagName -q '.[].tagName' \
          | grep '^snapshot-' | sort -r | tail -n +"$((KEEP_RELEASES + 1))" \
          | xargs -r -I{} gh release delete {} --yes --cleanup-tag

  # INF-2 (OFF by default): publish the feeds of the releases that still exist to GitHub Pages.
  # Rebuilt from release assets every run, so feed retention follows KEEP_RELEASES exactly.
  # Needs Pages enabled with source "GitHub Actions" (a repository setting only the human changes).
  feed-pages:
    needs: [check, build]
    if: vars.APK_FEED == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Assemble the feeds of kept releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/feeds dl
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | grep '^snapshot-' | sort -r | head -n "$KEEP_RELEASES" > tags.txt
          while read -r tag; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern 'feed-*.tar.gz' \
              --dir "dl/$tag" || continue
            for t in "dl/$tag"/feed-*.tar.gz; do
              # our own artifacts, but still refuse absolute or parent paths
              if tar -tzf "$t" | grep -qE '^/|(^|/)\.\.(/|$)'; then
                echo "::error::unsafe path in $t"; exit 1
              fi
              tar -xzf "$t" --no-same-owner -C site/feeds
            done
          done < tags.txt
          { echo '<!doctype html><meta charset="utf-8"><title>apk feeds</title><h1>apk feeds</h1><ul>'
            for d in site/feeds/*/; do echo "<li>$(basename "$d")</li>"; done
            echo '</ul>'; } > site/index.html
          touch site/.nojekyll
          kb=$(du -sk site | cut -f1)
          echo "site size: ${kb} KB"
          # GitHub Pages: published sites may be no larger than 1 GB
          if [ "$kb" -gt 1000000 ]; then
            echo "::error::site is ${kb} KB, over the 1 GB Pages limit; lower KEEP_RELEASES"; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
